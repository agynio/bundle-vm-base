name: Release

# Builds and publishes the base VM image to GHCR, where the platform build
# (agynio/bundle-vm) pulls it from by version.
#
# amd64 builds here. arm64 does not: GitHub offers no arm64 runner with nested
# virtualization, and without KVM the bake takes hours. Until such a runner
# exists, arm64 is released from a maintainer's machine with the same script
# this workflow runs — see `scripts/release.sh`.

# Never on pull_request: a release publishes, and a PR is not a release.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.1)"
        required: true
      publish:
        description: "Publish to GHCR"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # A tag publishes the version users pin; a push to main publishes
      # sha-<commit>, which exists so the image is known to still build and so a
      # specific commit can be tried by the platform build.
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="sha-$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

      # A hosted runner has ~14 GB free on /; this build needs more.
      - name: Free disk space
        run: |
          before=$(df -BG --output=avail / | awk 'NR==2{gsub("G","");print $1}')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          after=$(df -BG --output=avail / | awk 'NR==2{gsub("G","");print $1}')
          echo "free disk: ${before}G -> ${after}G"

      # The bake boots a VM inside this runner. Without acceleration the job
      # would burn its timeout rather than fail with a reason.
      - name: Verify KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing on this runner; the image cannot be built at usable speed"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils xz-utils cloud-image-utils
          curl -fsSL https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update && sudo apt-get install -y packer
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          packer version && oras version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Release amd64
        run: |
          args=(amd64 "${{ steps.version.outputs.version }}")
          [ "${{ github.event.inputs.publish }}" = "false" ] && args+=(--no-publish)
          scripts/release.sh "${args[@]}"

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd64-metadata
          path: |
            artifacts/amd64/metadata.json
            artifacts/amd64/checksums.sha256
            artifacts/amd64/lima.yaml
          if-no-files-found: warn

      - name: Summary
        if: success()
        run: |
          {
            echo "### Released base amd64 ${{ steps.version.outputs.version }}"
            echo
            cat artifacts/amd64/checksums.sha256
            echo
            echo "Pin it in \`bundle-vm/versions.env\`:"
            echo
            echo '```'
            echo "BASE_IMAGE_VERSION=${{ steps.version.outputs.version }}"
            echo '```'
            echo
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "**arm64 is not built by CI.** Release it from a maintainer machine:"
              echo
              echo '```bash'
              echo "scripts/release.sh arm64 ${{ steps.version.outputs.version }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
