name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version tag without architecture suffix
        required: false
        type: string
      publish:
        description: Publish OCI artifacts to GHCR
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck yamllint jq

      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Static validation
        run: scripts/static-validate.sh

  build-amd64:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="sha-${GITHUB_SHA::12}"
          fi
          version="$(scripts/validate-version.sh "${version}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system qemu-utils xorriso xz-utils jq

      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Select KVM accelerator
        id: qemu
        run: |
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "amd64 VM builds require a GitHub-hosted x86_64 runner; got $(uname -m)." >&2
            exit 1
          fi
          accelerator="$(scripts/select-qemu-accelerator.sh)"
          if [ "${accelerator}" != "kvm" ]; then
            echo "KVM is not available on this GitHub-hosted runner." >&2
            echo "This repository does not support publish builds under non-KVM QEMU." >&2
            echo "Observed TCG runs timed out during k3s/cert-manager/Argo CD provisioning." >&2
            echo "Use a GitHub-hosted/larger runner SKU with usable /dev/kvm." >&2
            exit 1
          fi
          echo "accelerator=${accelerator}" >> "${GITHUB_OUTPUT}"
          echo "QEMU accelerator: ${accelerator}"

      - name: Build amd64 disk
        run: scripts/build.sh amd64
        env:
          QEMU_ACCELERATOR: ${{ steps.qemu.outputs.accelerator }}

      - name: Package amd64 artifact
        run: scripts/package.sh amd64 "${{ steps.version.outputs.version }}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-vm-base-amd64
          path: artifacts/amd64
          if-no-files-found: error

      - name: Login to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        if: inputs.publish
        uses: oras-project/setup-oras@v1

      - name: Publish amd64 OCI artifact
        if: inputs.publish
        run: |
          tags=()
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags+=(latest)
          fi
          scripts/publish.sh amd64 "${{ steps.version.outputs.version }}" "${IMAGE}" "${tags[@]}"

  build-arm64:
    needs: static
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="sha-${GITHUB_SHA::12}"
          fi
          version="$(scripts/validate-version.sh "${version}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system qemu-utils xorriso xz-utils jq

      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Select KVM accelerator
        id: qemu
        run: |
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "arm64 VM builds require a GitHub-hosted aarch64 runner; got $(uname -m)." >&2
            exit 1
          fi
          accelerator="$(scripts/select-qemu-accelerator.sh)"
          if [ "${accelerator}" != "kvm" ]; then
            echo "KVM is not available on this GitHub-hosted ARM64 runner." >&2
            echo "This repository does not support publish builds under non-KVM QEMU." >&2
            echo "Observed TCG runs timed out during k3s/cert-manager/Argo CD provisioning." >&2
            echo "Hosted arm64 KVM availability is the remaining blocker for arm64 publish builds." >&2
            exit 1
          fi
          echo "accelerator=${accelerator}" >> "${GITHUB_OUTPUT}"
          echo "QEMU accelerator: ${accelerator}"

      - name: Build arm64 disk
        run: scripts/build.sh arm64
        env:
          QEMU_ACCELERATOR: ${{ steps.qemu.outputs.accelerator }}

      - name: Package arm64 artifact
        run: scripts/package.sh arm64 "${{ steps.version.outputs.version }}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-vm-base-arm64
          path: artifacts/arm64
          if-no-files-found: error

      - name: Login to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        if: inputs.publish
        uses: oras-project/setup-oras@v1

      - name: Publish arm64 OCI artifact
        if: inputs.publish
        run: |
          tags=()
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags+=(latest)
          fi
          scripts/publish.sh arm64 "${{ steps.version.outputs.version }}" "${IMAGE}" "${tags[@]}"
