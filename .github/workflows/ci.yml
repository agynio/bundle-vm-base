name: CI

# Everything checkable without booting a VM. The release build takes most of an
# hour; a shell typo or a malformed packer template should not wait for it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          status=0
          for script in scripts/*.sh; do
            bash -n "${script}" || status=1
          done
          exit "${status}"

      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning scripts/*.sh

      # Guards the arm64 SCSI device policy in the packer template, which has
      # regressed before and only shows up as an unbootable arm64 disk.
      - name: Static validation
        run: scripts/static-validate.sh

      - name: Install packer
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update && sudo apt-get install -y packer

      - name: Packer fmt and validate
        working-directory: packer
        run: |
          packer fmt -check -diff .
          packer init .
          # validate parses ssh_private_key_file for real, so it needs a key.
          ssh-keygen -t ed25519 -N '' -f /tmp/validate-key -q
          packer validate \
            -var arch=amd64 \
            -var ssh_private_key_file=/tmp/validate-key \
            -var ssh_public_key="$(cat /tmp/validate-key.pub)" \
            .
